# Foundry fuzz + invariant layer, sharing the same contracts as the Hardhat suite.
[profile.default]
src = "contracts"
out = "out-forge"
libs = ["node_modules", "lib"]
test = "test-forge"
cache_path = "cache-forge"
solc = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "erc721a/=node_modules/erc721a/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 10000

[invariant]
runs = 256
depth = 40
fail_on_revert = false
